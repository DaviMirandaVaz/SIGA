<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financeiro - SIGA</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- CSS -->
    <link href="../css/main.css" type="text/css" rel="stylesheet">
    <script src="../javascript/auth.js" defer></script>
    <script src="../javascript/financeiro.js" defer></script>
</head>

<body data-requer-login="true">
    <!-- 🌿 Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-3 shadow-sm">
        <div class="container-fluid mx-4">
            <a class="navbar-brand fw-bold text-success" href="../html/home.html">
                <i class="fas fa-seedling"></i> SIGA
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="../html/main.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="../html/estoque.html">Estoque</a></li>
                    <li class="nav-item"><a class="nav-link" href="../html/visualizar_fazenda.html">Fazenda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../html/usuarios.html">Usuário</a></li>
                    <li class="nav-item"><a class="nav-link active" href="../html/financeiro.html"><i
                                class="fas me-1"></i>Financeiro</a></li>
                </ul>
            </div>

            <div id="usuario-menu" class="dropdown"></div>
        </div>
    </nav>

    <!-- 💰 Conteúdo principal -->
    <div class="container-fluid mt-4">
        <div class="row">
            <main class="col-lg-10 offset-lg-1">
                <div class="content-panel">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="section-title mb-0">💼 Controle Financeiro</h4>
                        <div class="d-flex align-items-center gap-2">
                            <select id="filtro-fazenda" class="form-select w-auto" onchange="filtrarPorFazenda()">
                                <option value="todas">Todas as Fazendas</option>
                            </select>
                        </div>
                    </div>

                    <!-- 💵 Resumo de Saldos -->
                    <div class="row text-center mb-4">
                        <div class="col-md-4">
                            <div class="card border-success shadow-sm">
                                <div class="card-body">
                                    <h6 class="text-success fw-bold mb-1">Saldo de Entradas</h6>
                                    <p class="fs-5 fw-semibold" id="saldo-entradas">R$ 0,00</p>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <div class="card border-danger shadow-sm">
                                <div class="card-body">
                                    <h6 class="text-danger fw-bold mb-1">Saldo de Saídas</h6>
                                    <p class="fs-5 fw-semibold" id="saldo-saidas">R$ 0,00</p>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <div class="card border-primary shadow-sm">
                                <div class="card-body">
                                    <h6 class="text-primary fw-bold mb-1">Saldo Total</h6>
                                    <p class="fs-5 fw-semibold" id="saldo-total">R$ 0,00</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Entradas -->
                    <h5 class="mt-4 text-success"><i class="fas fa-arrow-down"></i> Entradas</h5>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-success">
                                <tr>
                                    <th>Data</th>
                                    <th>Descrição</th>
                                    <th>Tipo</th>
                                    <th>Valor</th>
                                    <th>Fazenda</th>
                                    <th>Produto</th>
                                </tr>
                            </thead>
                            <tbody id="lista-entradas"></tbody>
                        </table>
                    </div>

                    <!-- Saídas -->
                    <h5 class="mt-4 text-danger"><i class="fas fa-arrow-up"></i> Saídas</h5>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-danger">
                                <tr>
                                    <th>Data</th>
                                    <th>Descrição</th>
                                    <th>Tipo</th>
                                    <th>Valor</th>
                                    <th>Fazenda</th>
                                    <th>Produto</th>
                                </tr>
                            </thead>
                            <tbody id="lista-saidas"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>

</html>
