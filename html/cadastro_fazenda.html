<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Fazenda - SIGA</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- JS -->
    <script src="../javascript/auth.js" defer></script>
    <script src="../javascript/cadastro_fazenda.js" defer></script>

    <!-- CSS personalizado -->
    <link href="../css/main.css" type="text/css" rel="stylesheet">
</head>

<body data-requer-login="true" data-requer-dono="true">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-3 shadow-sm">
        <div class="container-fluid mx-4">
            <a class="navbar-brand fw-bold text-success" href="../html/home.html">
                <i class="fas fa-seedling"></i> SIGA
            </a>

            <!-- Botão de menu responsivo -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Itens da navbar -->
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="../html/main.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../html/estoque.html">Estoque</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../html/visualizar_fazenda.html">Fazenda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../html/usuarios.html">Usuário</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../html/financeiro.html">
                            <i class="fas me-1"></i> Financeiro
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Menu do usuário -->
            <div id="usuario-menu" class="dropdown">
                <!-- O botão e o menu serão injetados pelo JS -->
            </div>
        </div>
    </nav>

    <!-- Layout principal -->
    <div class="container-fluid mt-4">
        <div class="row">

            <!-- Sidebar -->
            <aside class="col-lg-2 col-md-3 offset-lg-1">
                <div class="sidebar">
                    <h5 class="sidebar-title">Ações</h5>
                    <button type="submit" form="cadastro-fazenda-form" class="sidebar-button">
                        <i class="fas fa-save"></i> Salvar
                    </button>
                    <button type="reset" form="cadastro-fazenda-form" class="sidebar-button">
                        <i class="fas fa-eraser"></i> Limpar Campos
                    </button>
                    <a href="../html/main.html" class="sidebar-button mt-3">
                        <i class="fas fa-arrow-left"></i> Voltar
                    </a>
                </div>
            </aside>

            <!-- Painel de conteúdo -->
            <main class="col-lg-8 col-md-9">
                <div class="content-panel">
                    <form id="cadastro-fazenda-form" class="form-container">
                        <h3>Cadastrar Nova Fazenda</h3>

                        <div class="form-group mt-3">
                            <label for="nome_fazenda" class="form-label">Nome da Fazenda:</label>
                            <input type="text" id="nome_fazenda" name="nome_fazenda" class="form-control"
                                placeholder="Ex: Fazenda Boa Vista" required>
                        </div>

                        <div class="form-group mt-3">
                            <label for="localizacao_fazenda" class="form-label">Localização:</label>
                            <input type="text" id="localizacao_fazenda" name="localizacao_fazenda" class="form-control"
                                placeholder="Ex: Zona Rural - Uberaba/MG">
                        </div>

                        <div class="form-group mt-3">
                            <label for="area_fazenda" class="form-label">Área (hectares):</label>
                            <input type="number" id="area_fazenda" name="area_fazenda" class="form-control" step="0.01"
                                placeholder="Ex: 45.50">
                        </div>
                    </form>
                </div>
            </main>

        </div>
    </div>

</body>

</html>
