<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main - SIGA</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- Js-->
    <script src="../javascript/produto.js" defer></script>
    <script src="../javascript/auth.js" defer></script>


    <!-- CSS personalizado -->
    <link href="../css/main.css" rel="stylesheet" type="text/css">
</head>

<body data-requer-login="true">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-3 shadow-sm">
        <div class="container-fluid mx-4">
            <a class="navbar-brand fw-bold text-success" href="../html/home.html">
                <i class="fas fa-seedling"></i> SIGA
            </a>

            <!-- Botão de menu responsivo -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Itens da navbar -->
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="../html/main.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../html/estoque.html">Estoque</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../html/visualizar_fazenda.html">Fazenda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../html/usuarios.html">Usuário</a>
                    </li>
                </ul>
            </div>

            <!-- Menu do usuário -->
            <div id="usuario-menu" class="dropdown">
                <!-- O botão e o menu serão injetados pelo JS -->
            </div>
        </div>
    </nav>


    <!-- Layout principal -->
    <div class="container-fluid mt-4">
        <div class="row">

            <!-- Sidebar -->
            <aside class="col-lg-2 col-md-3 offset-lg-1">
                <div class="sidebar">
                    <h5 class="sidebar-title">Ações</h5>
                    <a href="#" class="sidebar-button">
                        <i class="fas fa-chart-line"></i> Relatório
                    </a>
                    <a href="#" class="sidebar-button">
                        <i class="fas fa-cogs"></i> Configurações
                    </a>
                    <a href="#" class="sidebar-button">
                        <i class="fas fa-users"></i> Usuários
                    </a>
                    <a href="../html/estoque.html" class="sidebar-button">
                        <i class="fas fa-boxes"></i> Estoque
                    </a>
                </div>
            </aside>

            <!-- Painel de conteúdo -->
            <main class="col-lg-8 col-md-9">
                <div class="content-panel">
                    <h3>Dashboard</h3>
                    <p>Bem-vindo ao sistema SIGA! Aqui você pode acompanhar os relatórios de produção, acessar o estoque
                        e gerenciar usuários.</p>

                    <!-- Cards de exemplo -->
                    <div class="row mt-4">
                        <div class="col-md-6 mb-3">
                            <div class="dashboard-card">
                                <i class="fas fa-box fa-2x text-success"></i>
                                <h5>Total de Produtos</h5>
                                <p>120</p>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="dashboard-card">
                                <i class="fas fa-hand-holding-seedling fa-2x text-success"></i>
                                <h5>Produção Atual</h5>
                                <p>75 Toneladas</p>
                            </div>
                        </div>
                    </div>

                </div>

        </div>
