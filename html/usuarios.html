<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários - SIGA</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="../javascript/auth.js" defer></script>
  <script src="../javascript/usuarios.js" defer></script>

  <!-- CSS personalizado -->
  <link href="../css/main.css" rel="stylesheet" type="text/css">
</head>

<body data-requer-login="true">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-3 shadow-sm">
    <div class="container-fluid mx-4">
      <a class="navbar-brand fw-bold text-success" href="../html/home.html">
        <i class="fas fa-seedling"></i> SIGA
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="../html/main.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="../html/estoque.html">Estoque</a></li>
          <li class="nav-item"><a class="nav-link" href="../html/visualizar_fazenda.html">Fazenda</a></li>
          <li class="nav-item"><a class="nav-link active" href="../html/usuarios.html">Usuário</a></li>
        </ul>
      </div>

      <div id="usuario-menu" class="dropdown"></div>
    </div>
  </nav>

  <!-- Layout principal -->
  <div class="container-fluid mt-4">
    <div class="row">

      <!-- Sidebar -->
      <aside class="col-lg-2 col-md-3 offset-lg-1">
        <div class="sidebar">
          <h5 class="sidebar-title">Ações</h5>
          <a href="#" class="sidebar-button"><i class="fas fa-chart-line"></i> Relatório</a>
          <a href="#" class="sidebar-button"><i class="fas fa-cogs"></i> Configurações</a>
          <a href="../html/usuarios.html" class="sidebar-button"><i class="fas fa-users"></i> Usuários</a>
          <a href="../html/estoque.html" class="sidebar-button"><i class="fas fa-boxes"></i> Estoque</a>
        </div>
      </aside>

      <!-- Painel de conteúdo -->
      <main class="col-lg-8 col-md-9">
        <div class="content-panel">
          <h3 class="mb-4"><i class="fas fa-users text-success"></i> Gerenciamento de Usuários</h3>

          <!-- Formulário de novo usuário -->
          <div class="card mb-4 shadow-sm border-0">
            <div class="card-body">
              <h5 class="card-title text-success fw-semibold mb-3">Adicionar Novo Usuário</h5>
              <form id="formNovoUsuario" class="row g-3">
                <div class="col-md-6">
                  <label for="nome" class="form-label">Nome</label>
                  <input type="text" class="form-control" id="nome" required>
                </div>
                <div class="col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" required>
                </div>
                <div class="col-md-6">
                  <label for="senha" class="form-label">Senha</label>
                  <input type="password" class="form-control" id="senha" required>
                </div>
                <div class="col-md-3">
                  <label for="tipo" class="form-label">Tipo</label>
                  <select id="tipo" class="form-select" required>
                    <option value="">Selecione</option>
                    <option value="FUNCIONARIO">Funcionário</option>
                    <option value="GERENTE">Gerente</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label for="fazenda" class="form-label">Fazenda</label>
                  <select id="fazenda" class="form-select" required>
                    <option value="">Carregando...</option>
                  </select>
                </div>
                <div class="col-12 text-end">
                  <button type="submit" class="btn btn-success px-4">
                    <i class="fas fa-plus"></i> Cadastrar
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Tabela de usuários -->
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h5 class="card-title text-success fw-semibold mb-3">Usuários Cadastrados</h5>
              <div class="table-responsive">
                <table class="table align-middle" id="tabelaUsuarios">
                  <thead class="table-light">
                    <tr>
                      <th>Nome</th>
                      <th>Email</th>
                      <th>Tipo</th>
                      <th>Fazenda</th>
                      <th>Ações</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Linhas carregadas via JS -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>

    </div>
  </div>

  <!-- Modal de edição -->
  <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content border-0 rounded-4">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title">Editar Usuário</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formEditarUsuario" class="row g-3">
            <input type="hidden" id="editIndex">
            <div class="col-12">
              <label for="editNome" class="form-label">Nome</label>
              <input type="text" class="form-control" id="editNome" required>
            </div>
            <div class="col-12">
              <label for="editEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="editEmail" required>
            </div>
            <div class="col-md-6">
              <label for="editTipo" class="form-label">Tipo</label>
              <select id="editTipo" class="form-select" required>
                <option value="FUNCIONARIO">Funcionário</option>
                <option value="GERENTE">Gerente</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="editFazenda" class="form-label">Fazenda</label>
              <select id="editFazenda" class="form-select" required></select>
            </div>
            <div class="col-12 text-end">
              <button type="submit" class="btn btn-success">Salvar Alterações</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
