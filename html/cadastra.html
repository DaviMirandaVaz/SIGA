<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto - SIGA</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- JS -->
    <script src="../javascript/produto.js" defer></script>
    <script src="../javascript/auth.js" defer></script>

    <!-- CSS personalizado -->
    <link href="../css/main.css" type="text/css" rel="stylesheet">
</head>

<body data-requer-login="true">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-3 shadow-sm">
        <div class="container-fluid mx-4">
            <a class="navbar-brand fw-bold text-success" href="../html/home.html">
                <i class="fas fa-seedling"></i> SIGA
            </a>

            <!-- Botão de menu responsivo -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Itens da navbar -->
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="../html/main.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../html/estoque.html">Estoque</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../html/visualizar_fazenda.html">Fazenda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../html/usuarios.html">Usuário</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../html/financeiro.html">
                            <i class="fas me-1"></i> Financeiro
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Menu do usuário -->
            <div id="usuario-menu" class="dropdown">
                <!-- O botão e o menu serão injetados pelo JS -->
            </div>
        </div>
    </nav>

    <!-- Layout principal -->
    <div class="container-fluid mt-4">
        <div class="row">

            <!-- Sidebar -->
            <aside class="col-lg-2 col-md-3 offset-lg-1">
                <div class="sidebar">
                    <h5 class="sidebar-title">Ações</h5>
                    <button type="submit" form="cadastro-produto-form" class="sidebar-button">
                        <i class="fas fa-save"></i> Salvar
                    </button>
                    <button type="reset" form="cadastro-produto-form" class="sidebar-button">
                        <i class="fas fa-eraser"></i> Limpar Campos
                    </button>
                    <a href="../html/estoque.html" class="sidebar-button mt-3">
                        <i class="fas fa-boxes"></i> Ver Estoque
                    </a>
                </div>
            </aside>

            <!-- Painel de conteúdo -->
            <main class="col-lg-8 col-md-9">
                <div class="content-panel">
                    <form id="cadastro-produto-form" class="form-container">
                        <h3>Cadastrar Novo Produto</h3>

                        <!-- Fazenda -->
                        <div class="form-group">
                            <label for="fazenda_select">Fazenda:</label>
                            <select id="fazenda_select" name="fazenda_select" required>
                                <option value="" disabled selected>Selecione uma fazenda</option>
                            </select>
                        </div>

                        <!-- Tipo de Produto -->
                        <div class="form-group">
                            <label for="tipo_produto">Tipo de Produto:</label>
                            <select id="tipo_produto" name="tipo_produto" required>
                                <option value="" disabled selected>Selecione um tipo</option>
                                <option value="entrada">Produto Entrada</option>
                                <option value="intermedio">Produto Intermediário</option>
                                <option value="saida">Produto Saída</option>
                            </select>
                        </div>

                        <!-- Nome do Produto -->
                        <div class="form-group">
                            <label for="nome_produto">Nome do Produto:</label>
                            <input type="text" id="nome_produto" name="nome_produto" placeholder="Ex: Milho Safra 2024"
                                required>
                        </div>

                        <!-- Campos de cada tipo -->
                        <div class="entrada campos-tipo">
                            <div class="form-group">
                                <label for="tipo_entrada">Tipo:</label>
                                <select id="tipo_entrada" name="tipo_entrada">
                                    <option value="" disabled selected>Selecione</option>
                                    <option value="ADUBO">ADUBO</option>
                                    <option value="SEMENTE">SEMENTE</option>
                                    <option value="FERTILIZANTE">FERTILIZANTE</option>
                                    <option value="HERBICIDA">HERBICIDA</option>
                                    <option value="OUTRO">OUTRO</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="unidade_medida_entrada">Unidade de Medida:</label>
                                <select id="unidade_medida_entrada" name="unidade_medida_entrada">
                                    <option value="" disabled selected>Selecione</option>
                                    <option value="KG">KG</option>
                                    <option value="L">L</option>
                                    <option value="SACA">SACA</option>
                                    <option value="TONELADA">TONELADA</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="quantidade_entrada">Quantidade:</label>
                                <input type="number" id="quantidade_entrada" min="0" step="0.01">
                            </div>
                            <div class="form-group">
                                <label for="valor_unitario">Valor Unitário:</label>
                                <input type="number" id="valor_unitario" min="0" step="0.01">
                            </div>
                            <div class="form-group">
                                <label for="data_compra">Data de Compra:</label>
                                <input type="date" id="data_compra">
                            </div>
                        </div>

                        <div class="intermedio campos-tipo">
                            <div class="form-group">
                                <label for="tipo_intermedio">Tipo:</label>
                                <select id="tipo_intermedio">
                                    <option value="" disabled selected>Selecione</option>
                                    <option value="PLANTAÇÃO">PLANTAÇÃO</option>
                                    <option value="LAVOURA">LAVOURA</option>
                                    <option value="PRODUÇÃO">PRODUÇÃO</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="quantidade_intermedio">Quantidade:</label>
                                <input type="number" id="quantidade_intermedio" min="0" step="0.01">
                            </div>
                            <div class="form-group">
                                <label for="valor_estimado">Valor Estimado:</label>
                                <input type="number" id="valor_estimado" min="0" step="0.01">
                            </div>
                            <div class="form-group">
                                <label for="data_inicio">Data de Início:</label>
                                <input type="date" id="data_inicio">
                            </div>
                        </div>

                        <div class="saida campos-tipo">
                            <div class="form-group">
                                <label for="unidade_medida_saida">Unidade de Medida:</label>
                                <select id="unidade_medida_saida">
                                    <option value="" disabled selected>Selecione</option>
                                    <option value="KG">KG</option>
                                    <option value="L">L</option>
                                    <option value="SACA">SACA</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="quantidade_saida">Quantidade:</label>
                                <input type="number" id="quantidade_saida" min="0" step="0.01">
                            </div>
                            <div class="form-group">
                                <label for="valor_venda">Valor de Venda:</label>
                                <input type="number" id="valor_venda" min="0" step="0.01">
                            </div>
                            <div class="form-group">
                                <label for="data_venda">Data de Venda:</label>
                                <input type="date" id="data_venda">
                            </div>
                        </div>

                    </form>
                </div>
            </main>
        </div>
    </div>
</body>

</html>
