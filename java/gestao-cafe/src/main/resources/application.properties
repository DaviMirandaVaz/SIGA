spring.application.name=gestao-cafe

# URL de conexão com o banco de dados MySQL (novo banco siga_bd)
spring.datasource.url=jdbc:mysql://localhost:3307/siga_bd?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Usuário e senha do banco de dados (padrão do XAMPP)
spring.datasource.username=root
spring.datasource.password=

# Configurações do Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Log detalhado de criação de schema
logging.level.org.hibernate.tool.hbm2ddl=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
